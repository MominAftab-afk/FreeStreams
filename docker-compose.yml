version: '3.8'

services:
  roseflix:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN}
        TMDB_API_KEY: ${TMDB_API_KEY}
        NEXT_PUBLIC_TMDB_API_KEY: ${NEXT_PUBLIC_TMDB_API_KEY}
        NEXT_PUBLIC_TMDB_BASE_URL: ${NEXT_PUBLIC_TMDB_BASE_URL:-https://api.themoviedb.org/3}
        NEXT_PUBLIC_TMDB_IMAGE_BASE_URL: ${NEXT_PUBLIC_TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-RoseFlix}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENABLE_ADS: ${NEXT_PUBLIC_ENABLE_ADS:-true}
        NEXT_PUBLIC_POPUNDER_SCRIPT_URL: ${NEXT_PUBLIC_POPUNDER_SCRIPT_URL:-}
        NEXT_PUBLIC_DIRECT_LINK_URL: ${NEXT_PUBLIC_DIRECT_LINK_URL:-https://asiafilm.org/4/287bf0d63aeec5a2ec61f86a8bf8e1bd}
    container_name: roseflix-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
